<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch to Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .menu-container {
            background-color: #1e1e1e;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid #2d2d2d;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .menu-title {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .menu-link {
            display: inline-block;
            width: 100%;
            padding: 12px 20px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .menu-link:hover {
            background-color: #1d4ed8;
        }

        .menu-link:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1 class="menu-title">Scratch to Web</h1>
        <a href="https://sheeptester.github.io/htmlifier/" target="_blank" rel="noopener noreferrer" class="menu-link">
            Go to htmlifier
        </a>
    </div>

</body>
</html>
