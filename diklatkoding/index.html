<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Koding Fun Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 16px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* Layout Grid untuk 2 Embed Canva Bersisian */
        .embed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
            width: 100%;
        }

        /* Container Responsive Embed Canva */
        .embed-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.25%; /* Rasio 16:9 */
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #243048;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            background: #161e2e;
        }

        .embed-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: #161e2e;
            color: #f3f4f6;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            border: 1px solid #243048;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #38bdf8, #818cf8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .menu-item:hover {
            background: #1d283d;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15);
            padding-left: 28px;
        }

        .menu-item:hover::before {
            opacity: 1;
        }

        .menu-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            font-size: 20px;
        }

        .arrow-icon {
            font-size: 18px;
            color: #64748b;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .menu-item:hover .arrow-icon {
            color: #38bdf8;
            transform: translateX(4px);
        }

        /* Tombol Download Google Drive */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            margin: 28px auto 0 auto;
            max-width: 520px;
            border: 1px solid rgba(52, 211, 153, 0.4);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            border-color: #34d399;
        }

        footer {
            margin-top: 36px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="embed-grid">
            <div class="embed-wrapper">
                <iframe loading="lazy" src="https://www.canva.com/design/DAHPoCMbHvg/-Htk_BaI-QYRjfuveizEdQ/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
            </div>
            <div class="embed-wrapper">
                <iframe loading="lazy" src="https://www.canva.com/design/DAHPvnZ0W4U/5CkJXyaKVzFUTUW3wIDE8g/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
            </div>
        </div>

        <span class="badge">Diklat Koding</span>
        <h1>Contoh Koding Fun Learning</h1>

        <div class="menu-list">
            <a href="/diklatkoding/bagaimanakeseharianku/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">📅</span>
                    <span>Bagaimana Keseharianku</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/siapakahaku/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">🕵️</span>
                    <span>Siapakah Aku</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/simetrirefleks/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">🪞</span>
                    <span>Simetri Refleks</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/susuncerita/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">📚</span>
                    <span>Susun Cerita</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/robotmanusia/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">🤖</span>
                    <span>Robot Manusia</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
        </div>

        <a href="https://drive.google.com/drive/folders/1shB5yTnRb4y_RE8CzGQZxyO9gyaSLn7p?usp=sharing" target="_blank" rel="noopener noreferrer" class="download-btn">
            <span class="menu-icon">📁</span>
            <span>Download</span>
        </a>

        <footer>
            &copy; Diklat Koding - Fun Learning
        </footer>
    </div>

</body>
</html>
