<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Koding Fun Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: #161e2e;
            color: #f3f4f6;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            border: 1px solid #243048;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #38bdf8, #818cf8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .menu-item:hover {
            background: #1d283d;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15);
            padding-left: 28px;
        }

        .menu-item:hover::before {
            opacity: 1;
        }

        .menu-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            font-size: 20px;
        }

        .arrow-icon {
            font-size: 18px;
            color: #64748b;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .menu-item:hover .arrow-icon {
            color: #38bdf8;
            transform: translateX(4px);
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Diklat Koding</span>
        <h1>Contoh Koding Fun Learning</h1>

        <div class="menu-list">
            <a href="/diklatkoding/bagaimanakeseharianku/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">📅</span>
                    <span>Bagaimana Keseharianku</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/siapakahaku/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">🕵️</span>
                    <span>Siapakah Aku</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/simetrirefleks/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">🪞</span>
                    <span>Simetri Refleks</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/susuncerita/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">📚</span>
                    <span>Susun Cerita</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="/diklatkoding/robotmanusia/" class="menu-item">
                <div class="menu-content">
                    <span class="menu-icon">🤖</span>
                    <span>Robot Manusia</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
        </div>

        <footer>
            &copy; Diklat Koding - Fun Learning
        </footer>
    </div>

</body>
</html>
