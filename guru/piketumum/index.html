<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Jadwal Piket Otomatis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Container untuk Login -->
    <div id="login-container" class="container">
        <div class="login-card">
            <h1>Generator Jadwal Piket</h1>
            <p>Silakan login untuk melanjutkan.</p>
            <button id="login-btn">Login dengan Google</button>
        </div>
    </div>

    <!-- Container Utama Aplikasi (Awalnya disembunyikan) -->
    <div id="app-container" class="container hidden">
        <header>
            <h1>Generator Jadwal Piket</h1>
            <div class="user-info">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn-logout">Logout</button>
            </div>
        </header>

        <main>
            <section class="input-section card">
                <h2>Input Data</h2>
                <div class="input-group">
                    <div class="input-controls">
                        <input type="text" id="student-name" placeholder="Nama Siswa">
                        <button id="add-student-btn">Tambah Siswa</button>
                    </div>
                    <ul id="student-list" class="item-list"></ul>
                </div>
                <div class="input-group">
                    <div class="input-controls">
                        <input type="text" id="task-name" placeholder="Nama Tugas (contoh: Piket Kelas)">
                        <select id="task-gender">
                            <option value="any">Semua Gender</option>
                            <option value="male">Laki-laki Saja</option>
                            <option value="female">Perempuan Saja</option>
                        </select>
                        <button id="add-task-btn">Tambah Tugas</button>
                    </div>
                    <ul id="task-list" class="item-list"></ul>
                </div>
            </section>

            <section class="schedule-section card">
                <h2>Jadwal Piket</h2>
                <div class="action-buttons">
                    <button id="generate-btn">Buat Jadwal Otomatis</button>
                    <button id="save-btn" class="no-print">Simpan ke Cloud</button>
                    <button id="export-btn" class="no-print">Ekspor ke CSV</button>
                    <button id="print-btn" class="no-print">Cetak</button>
                </div>
                <div id="schedule-container">
                    <!-- Jadwal akan dirender di sini oleh JavaScript -->
                    <p class="placeholder-text">Belum ada jadwal. Silakan tambahkan siswa/tugas dan klik "Buat Jadwal Otomatis".</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, writeBatch } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBRCQbJFfUtJblg2M3DT6AG-DkX_IZPjEQ",
            authDomain: "jadwalpiketumum.firebaseapp.com",
            projectId: "jadwalpiketumum",
            storageBucket: "jadwalpiketumum.firebasestorage.app",
            messagingSenderId: "247334063134",
            appId: "1:247334063134:web:86d2ee543c8d8fb510f20f"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Export agar bisa digunakan di app.js
        window.auth = auth;
        window.db = db;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.collection = collection;
        window.writeBatch = writeBatch;
    </script>
    
    <!-- Logika Aplikasi -->
    <script src="app.js"></script>

</body>
</html>
