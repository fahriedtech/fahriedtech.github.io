<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jadwal Piket AI - v4.5 Anti-Crash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        /* --- STYLES --- */
        .draggable-item { cursor: grab; touch-action: manipulation; user-select: none; transition: transform 0.1s; }
        .draggable-item:active { cursor: grabbing; transform: scale(0.95); }
        .item-selected { background-color: #fef08a !important; border-color: #eab308 !important; transform: scale(1.02); z-index: 50; }
        .drop-zone { transition: background-color 0.2s; min-height: 80px; }
        .zone-highlight { background-color: #eff6ff !important; border: 2px dashed #3b82f6 !important; }
        @media print { .no-print { display: none !important; } body { background: white; } #schedule-print-area { box-shadow: none; border: none; } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 pb-20">

    <div class="max-w-7xl mx-auto p-4 lg:p-8">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200 gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-800">
                    ✨ Generator Piket AI <span class="text-[10px] bg-green-600 text-white px-2 py-1 rounded-full">v4.5 Robust</span>
                </h1>
                <p class="text-xs text-gray-500">Pembersih Respon Cerdas Aktif</p>
            </div>
            <button onclick="resetApp()" class="no-print text-xs bg-red-100 text-red-600 px-3 py-2 rounded border border-red-200">
                ⚠️ Reset Total
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- INPUTS -->
            <div class="lg:col-span-4 space-y-5 no-print order-2 lg:order-1">
                
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="font-bold text-gray-700 mb-2">1. Data Siswa & API</h2>
                    
                    <!-- API KEY -->
                    <details class="mb-3 bg-gray-50 border rounded text-xs">
                        <summary class="p-2 cursor-pointer font-bold text-gray-500">🔑 API Key (Klik)</summary>
                        <div class="p-2 border-t">
                            <input type="password" id="apiKeyInput" class="w-full p-2 border rounded" placeholder="Tempel API Key...">
                            <button id="btnTest" class="mt-2 w-full bg-gray-700 text-white py-1 rounded">Tes Koneksi</button>
                        </div>
                    </details>

                    <textarea id="studentInput" rows="6" class="w-full text-sm p-3 border rounded mb-2" placeholder="Masukkan nama siswa per baris..."></textarea>
                    
                    <button id="btnGender" class="w-full bg-blue-600 text-white py-3 rounded-lg text-sm font-bold hover:bg-blue-700 shadow-md">
                        ✨ Deteksi Gender (AI)
                    </button>
                    
                    <div id="previewList" class="mt-2 flex flex-wrap gap-1 max-h-32 overflow-y-auto"></div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="font-bold text-gray-700">2. Data Tugas</h2>
                        <button id="btnTask" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded border font-bold">💡 Saran AI</button>
                    </div>
                    <textarea id="taskInput" rows="5" class="w-full text-sm p-3 border rounded" placeholder="Isi tugas..."></textarea>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <button id="btnGen" class="w-full bg-gray-900 text-white py-3 rounded-lg font-bold hover:bg-black shadow-lg mb-2">🎲 Acak Jadwal</button>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btnImg" class="bg-indigo-50 text-indigo-700 py-2 rounded text-xs font-bold border border-indigo-200">📸 Simpan</button>
                        <button onclick="window.print()" class="bg-gray-50 text-gray-700 py-2 rounded text-xs font-bold border border-gray-200">🖨️ Cetak</button>
                    </div>
                </div>
            </div>

            <!-- RESULTS -->
            <div class="lg:col-span-8 space-y-4 order-1 lg:order-2">
                <div class="sticky top-2 z-40 bg-white p-4 rounded-xl shadow-sm border border-gray-200 no-print">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">🏦 Bank Siswa (Unassigned)</h3>
                    <div id="bankZone" class="drop-zone flex flex-wrap gap-2 mt-2 min-h-[50px] bg-gray-50 rounded p-2 border-2 border-dashed border-gray-300"></div>
                </div>

                <div id="printArea" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 min-h-[500px]">
                    <div class="flex justify-between items-end border-b pb-4 mb-4">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">JADWAL PIKET KELAS</h2>
                            <p class="text-xs text-gray-500 mt-1" id="dateDisplay">-</p>
                        </div>
                    </div>
                    <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <p class="text-center text-gray-400 col-span-full py-10">Belum ada jadwal.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- DATA ---
            let data = { students: [], tasks: [], assignments: [] };
            const DEFAULT_KEY = "AIzaSyD7T0khO8G9HQBKS2YQH3ZIKCUfCWw3jdQ"; // Public fallback
            
            // --- DOM ---
            const el = {
                students: document.getElementById('studentInput'),
                tasks: document.getElementById('taskInput'),
                key: document.getElementById('apiKeyInput'),
                preview: document.getElementById('previewList'),
                grid: document.getElementById('scheduleGrid'),
                bank: document.getElementById('bankZone'),
                date: document.getElementById('dateDisplay'),
                print: document.getElementById('printArea'),
                // Btns
                btnGender: document.getElementById('btnGender'),
                btnTask: document.getElementById('btnTask'),
                btnGen: document.getElementById('btnGen'),
                btnTest: document.getElementById('btnTest'),
                btnImg: document.getElementById('btnImg')
            };

            el.date.innerText = `Update: ${new Date().toLocaleDateString('id-ID')}`;

            // --- CORE UTILS ---
            const uid = () => Math.random().toString(36).substr(2, 9);
            const save = () => localStorage.setItem('piket_v45', JSON.stringify(data));
            const getKey = () => el.key.value.trim() || DEFAULT_KEY;

            // FUNGSI PEMBERSIH JSON (RAHASIA AGAR TIDAK CRASH)
            const cleanAndParseJSON = (text) => {
                try {
                    // 1. Coba parse langsung
                    return JSON.parse(text);
                } catch (e) {
                    // 2. Jika gagal, cari kurung kurawal pertama { dan terakhir }
                    const start = text.indexOf('{');
                    const end = text.lastIndexOf('}');
                    if (start !== -1 && end !== -1) {
                        try {
                            const jsonStr = text.substring(start, end + 1);
                            return JSON.parse(jsonStr);
                        } catch (e2) { return null; }
                    }
                    return null;
                }
            };

            // --- PARSING ---
            const parse = () => {
                // Students
                const sLines = el.students.value.split('\n');
                const sMap = new Map(data.students.map(s => [s.name, s]));
                data.students = sLines.filter(l => l.trim()).map(line => {
                    const name = line.trim();
                    const ex = sMap.get(name);
                    return { id: ex ? ex.id : uid(), name: name, gender: ex ? ex.gender : '?' };
                });

                // Tasks
                const tLines = el.tasks.value.split('\n');
                data.tasks = tLines.filter(l => l.includes('-')).map(line => {
                    const [loc, ...rest] = line.split('-');
                    let name = rest.join('-').trim();
                    let cons = '-';
                    if(name.includes('[L]')) { cons = 'L'; name = name.replace('[L]', '').trim(); }
                    if(name.includes('[P]')) { cons = 'P'; name = name.replace('[P]', '').trim(); }
                    
                    const ex = data.tasks.find(t => t.location === loc.trim() && t.name === name);
                    return { id: ex ? ex.id : uid(), location: loc.trim(), name: name, constraint: cons };
                });

                // Assignments
                data.assignments = data.assignments.filter(a => 
                    data.students.find(s => s.id === a.sid) && data.tasks.find(t => t.id === a.tid)
                );

                render();
                save();
            };

            // --- AI LOGIC (ROBUST) ---
            
            // 1. TEST KONEKSI
            el.btnTest.addEventListener('click', async () => {
                el.btnTest.innerText = "⏳ Cek...";
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${getKey()}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Hi" }] }] })
                    });
                    const j = await res.json();
                    if(j.error) throw new Error(j.error.message);
                    alert("✅ Koneksi Sukses! API Key Berfungsi.");
                } catch(e) {
                    alert("❌ Koneksi Gagal:\n" + e.message);
                } finally { el.btnTest.innerText = "Tes Koneksi"; }
            });

            // 2. GENDER
            el.btnGender.addEventListener('click', async () => {
                parse();
                if(data.students.length === 0) return alert("Ketik nama siswa dulu.");
                
                el.btnGender.disabled = true;
                el.btnGender.innerText = "⏳ Menghubungi AI...";

                try {
                    const names = data.students.map(s => s.name);
                    const prompt = `OUTPUT JSON ONLY. Classify gender (L/P) for: ${JSON.stringify(names)}. Format: {"Budi":"L", "Siti":"P"}. NO MARKDOWN.`;
                    
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${getKey()}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const j = await res.json();
                    if(j.error) throw new Error(j.error.message);
                    
                    const raw = j.candidates[0].content.parts[0].text;
                    const map = cleanAndParseJSON(raw); // PEMBERSIH JSON BERAKSI

                    if(!map) throw new Error("Gagal membaca jawaban AI (Format rusak).");

                    let count = 0;
                    data.students.forEach(s => {
                        if(map[s.name]) { s.gender = map[s.name]; count++; }
                    });
                    
                    alert(`Sukses! ${count} siswa terdeteksi.`);
                    render(); save();

                } catch(e) {
                    alert("GAGAL: " + e.message);
                } finally {
                    el.btnGender.disabled = false;
                    el.btnGender.innerText = "✨ Deteksi Gender (AI)";
                }
            });

            // 3. TASKS
            el.btnTask.addEventListener('click', async () => {
                el.btnTask.disabled = true;
                el.btnTask.innerText = "⏳...";

                try {
                    const prompt = "List 20 tugas piket sekolah Indonesia. Format per baris: LOKASI - TUGAS [L/P]. Jangan pakai tabel/nomor. Contoh: Kelas - Sapu [P]";
                    
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${getKey()}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const j = await res.json();
                    if(j.error) throw new Error(j.error.message);
                    
                    let text = j.candidates[0].content.parts[0].text;
                    // Bersihkan format aneh
                    text = text.replace(/\*/g, '').replace(/`/g, '');
                    
                    if(el.tasks.value) el.tasks.value += '\n' + text;
                    else el.tasks.value = text;
                    
                    parse();

                } catch(e) {
                    alert("GAGAL: " + e.message);
                } finally {
                    el.btnTask.disabled = false;
                    el.btnTask.innerText = "💡 Saran AI";
                }
            });

            // --- SCHEDULING ---
            el.btnGen.addEventListener('click', () => {
                parse();
                if(data.tasks.length === 0) return alert("Isi tugas dulu.");
                
                const available = data.students.filter(s => s.gender !== '?');
                data.assignments = [];
                available.sort(() => Math.random() - 0.5);

                const getLoad = (tid) => data.assignments.filter(a => a.tid === tid).length;

                available.forEach(s => {
                    // Filter tasks: Gender cocok ATAU tugas netral
                    let candidates = data.tasks.filter(t => t.constraint === '-' || t.constraint === s.gender);
                    
                    if(candidates.length > 0) {
                        // Pilih yang paling sepi
                        candidates.sort((a, b) => getLoad(a.id) - getLoad(b.id));
                        data.assignments.push({ sid: s.id, tid: candidates[0].id });
                    }
                });
                render(); save();
            });

            // --- RENDER ---
            function render() {
                // Preview
                el.preview.innerHTML = '';
                data.students.forEach(s => {
                    const c = s.gender === 'L' ? 'bg-blue-100 text-blue-800' : s.gender === 'P' ? 'bg-pink-100 text-pink-800' : 'bg-gray-200';
                    el.preview.innerHTML += `<span class="text-[10px] px-2 py-1 rounded ${c}">${s.name} (${s.gender})</span>`;
                });

                // Bank & Grid
                el.bank.innerHTML = '';
                el.grid.innerHTML = '';

                const unassigned = data.students.filter(s => !data.assignments.find(a => a.sid === s.id));
                unassigned.forEach(s => el.bank.appendChild(createPill(s)));

                const locs = [...new Set(data.tasks.map(t => t.location))];
                if(locs.length === 0) el.grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-10">Tugas kosong.</p>';

                locs.forEach(loc => {
                    const div = document.createElement('div');
                    div.className = 'col-span-full mt-2';
                    div.innerHTML = `<h3 class="font-bold border-b pb-1 mb-2">${loc}</h3>`;
                    el.grid.appendChild(div);

                    data.tasks.filter(t => t.location === loc).forEach(t => {
                        const card = document.createElement('div');
                        card.className = 'bg-white border rounded p-3 break-inside-avoid';
                        const badge = t.constraint !== '-' ? `<span class="text-xs font-bold text-gray-500">[${t.constraint}]</span>` : '';
                        card.innerHTML = `<div class="flex justify-between mb-2 text-sm font-semibold"><span>${t.name}</span>${badge}</div>`;
                        
                        const zone = document.createElement('div');
                        zone.className = 'drop-zone bg-gray-50 rounded border-dashed border-2 p-2 flex flex-wrap gap-2';
                        zone.dataset.tid = t.id;

                        data.assignments.filter(a => a.tid === t.id).forEach(a => {
                            const s = data.students.find(x => x.id === a.sid);
                            if(s) zone.appendChild(createPill(s));
                        });
                        card.appendChild(zone);
                        el.grid.appendChild(card);
                    });
                });
            }

            // --- DRAG & DROP + CLICK ---
            let selId = null; 
            let dragId = null;

            function createPill(s) {
                const d = document.createElement('div');
                const c = s.gender === 'L' ? 'bg-blue-100 text-blue-800' : s.gender === 'P' ? 'bg-pink-100 text-pink-800' : 'bg-gray-200';
                d.className = `draggable-item text-xs font-bold px-3 py-2 rounded shadow-sm cursor-pointer ${c}`;
                d.innerText = s.name;
                d.draggable = true;
                
                // Click
                d.onclick = (e) => {
                    e.stopPropagation();
                    if(selId === s.id) { selId = null; document.querySelectorAll('.item-selected').forEach(x => x.classList.remove('item-selected')); }
                    else {
                        selId = s.id;
                        document.querySelectorAll('.item-selected').forEach(x => x.classList.remove('item-selected'));
                        d.classList.add('item-selected');
                    }
                };
                
                // Drag
                d.ondragstart = () => { dragId = s.id; };
                return d;
            }

            // Move Logic
            const move = (sid, tid) => {
                const s = data.students.find(x => x.id === sid);
                const t = tid ? data.tasks.find(x => x.id === tid) : null;
                
                if(t && t.constraint !== '-' && t.constraint !== s.gender) {
                    return alert(`Gagal: Tugas khusus ${t.constraint}, Siswa ${s.gender}`);
                }

                data.assignments = data.assignments.filter(a => a.sid !== sid);
                if(tid) data.assignments.push({ sid: sid, tid: tid });
                
                selId = null; dragId = null;
                document.querySelectorAll('.item-selected').forEach(x => x.classList.remove('item-selected'));
                render(); save();
            };

            // Global Listeners
            document.addEventListener('click', (e) => {
                const z = e.target.closest('.drop-zone');
                if(z && selId) move(selId, z.dataset.tid);
            });
            document.addEventListener('dragover', e => e.preventDefault());
            document.addEventListener('drop', e => {
                const z = e.target.closest('.drop-zone');
                if(z && dragId) { e.preventDefault(); move(dragId, z.dataset.tid); }
            });

            // Utils
            window.resetApp = () => { if(confirm("Hapus semua?")) { localStorage.removeItem('piket_v45'); location.reload(); } };
            
            el.btnImg.onclick = () => {
                html2canvas(el.print, { scale: 2 }).then(c => {
                    const a = document.createElement('a'); a.download = 'jadwal.jpg'; a.href = c.toDataURL(); a.click();
                });
            };

            el.students.addEventListener('input', parse);
            el.tasks.addEventListener('input', parse);
            el.key.addEventListener('input', () => localStorage.setItem('my_key', el.key.value));

            // Load
            if(localStorage.getItem('my_key')) el.key.value = localStorage.getItem('my_key');
            if(localStorage.getItem('piket_v45')) {
                data = JSON.parse(localStorage.getItem('piket_v45'));
                el.students.value = data.students.map(s => s.name).join('\n');
                el.tasks.value = data.tasks.map(t => `${t.location}-${t.name}${t.constraint!=='-'?' ['+t.constraint+']':''}`).join('\n');
                render();
            }
        });
    </script>
</body>
</html>
