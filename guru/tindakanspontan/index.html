<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru Tenang: Rencana Aksi Spontan</title>
  <link rel="icon" href="/images/favicon.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Markdown Parser (Marked) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .phase-card { transition: all 0.3s ease; }
        .phase-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.5rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-top: 0.5rem; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body strong { color: #1e293b; font-weight: 700; }
        .markdown-body em { font-style: italic; color: #475569; }
        
        /* Loading Animation */
        .breathing-circle {
            animation: breathe 3s infinite ease-in-out;
        }
        @keyframes breathe {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Guru Tenang</h1>
                    <p class="text-xs text-slate-500 font-medium">Konsultan Disiplin AI Real-time</p>
                </div>
            </div>
            <div id="auth-status" class="text-xs text-slate-400 font-mono bg-slate-100 px-2 py-1 rounded">
                <span class="inline-block w-2 h-2 bg-slate-400 rounded-full mr-1"></span> Init...
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-start pt-8 pb-12 px-4">
        
        <!-- Input Section -->
        <div id="input-section" class="w-full max-w-3xl bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8 transition-all duration-500">
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                Apa yang baru saja terjadi?
            </label>
            <textarea id="scenario-input" rows="3" 
                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-none text-slate-700 placeholder-slate-400"
                placeholder="Contoh: Budi melempar kertas ke temannya saat saya sedang menjelaskan di papan tulis..."></textarea>
            
            <div class="mt-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex gap-2 text-xs overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0">
                    <span class="text-slate-400 whitespace-nowrap">Coba cepat:</span>
                    <button onclick="fillInput('Siswa menolak mengerjakan tugas dan melipat tangan di dada.')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-600 transition whitespace-nowrap active:scale-95">Siswa Menolak</button>
                    <button onclick="fillInput('Dua siswa saling mengejek dengan suara keras di belakang.')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-600 transition whitespace-nowrap active:scale-95">Gaduh</button>
                </div>
                <button id="generate-btn" onclick="window.generatePlan()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 active:scale-95 text-white font-medium py-2 px-6 rounded-lg transition transform flex items-center justify-center gap-2 shadow-lg shadow-indigo-200 cursor-pointer select-none">
                    <i data-lucide="zap" class="w-4 h-4"></i> Buat Rencana Aksi
                </button>
            </div>
        </div>

        <!-- Loading Section -->
        <div id="loading-section" class="hidden w-full max-w-3xl text-center py-12">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 rounded-full mb-4 breathing-circle">
                <i data-lucide="loader-2" class="w-8 h-8 text-indigo-600 animate-spin"></i>
            </div>
            <h3 class="text-lg font-medium text-slate-700">Menganalisis Situasi...</h3>
            <p class="text-slate-500 text-sm mt-1">Tarik napas dalam. AI sedang menyusun strategi taktis.</p>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden w-full max-w-3xl space-y-6">
            
            <!-- Diagnosis Banner -->
            <div class="bg-slate-800 text-white rounded-lg p-4 flex items-start gap-3 shadow-md">
                <i data-lucide="scan-eye" class="w-6 h-6 text-indigo-300 mt-1 flex-shrink-0"></i>
                <div>
                    <h2 class="text-sm uppercase tracking-wider text-indigo-300 font-bold mb-1">Skenario Teridentifikasi</h2>
                    <p id="scenario-output" class="text-lg font-light leading-snug">...</p>
                </div>
            </div>

            <!-- The 3 Phases Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Phase 1 -->
                <div class="phase-card bg-white p-5 rounded-xl border-l-4 border-red-500 shadow-sm flex flex-col">
                    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-slate-100">
                        <div class="bg-red-100 p-1.5 rounded text-red-600">
                            <i data-lucide="pause-octagon" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm">FASE 1: BEKUKAN</h3>
                            <span class="text-[10px] text-slate-400 font-mono">1–3 Detik</span>
                        </div>
                    </div>
                    <div id="phase-1-content" class="markdown-body text-sm text-slate-600 flex-grow"></div>
                </div>

                <!-- Phase 2 -->
                <div class="phase-card bg-white p-5 rounded-xl border-l-4 border-amber-500 shadow-sm flex flex-col">
                    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-slate-100">
                        <div class="bg-amber-100 p-1.5 rounded text-amber-600">
                            <i data-lucide="message-square" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm">FASE 2: INTERVENSI</h3>
                            <span class="text-[10px] text-slate-400 font-mono">5–10 Detik</span>
                        </div>
                    </div>
                    <div id="phase-2-content" class="markdown-body text-sm text-slate-600 flex-grow"></div>
                </div>

                <!-- Phase 3 -->
                <div class="phase-card bg-white p-5 rounded-xl border-l-4 border-emerald-500 shadow-sm flex flex-col">
                    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-slate-100">
                        <div class="bg-emerald-100 p-1.5 rounded text-emerald-600">
                            <i data-lucide="arrow-right-circle" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm">FASE 3: REDIREKSI</h3>
                            <span class="text-[10px] text-slate-400 font-mono">15–30 Detik</span>
                        </div>
                    </div>
                    <div id="phase-3-content" class="markdown-body text-sm text-slate-600 flex-grow"></div>
                </div>
            </div>

            <!-- Class Cohesion Strategy -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-5">
                <div class="flex items-center gap-2 mb-2">
                    <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i>
                    <h3 class="font-bold text-indigo-900 text-sm">Strategi Kohesi Kelas</h3>
                </div>
                <p id="cohesion-output" class="text-sm text-indigo-800 leading-relaxed"></p>
            </div>

            <button onclick="window.resetApp()" class="mx-auto block text-slate-400 hover:text-indigo-600 text-sm font-medium transition py-4 active:scale-95">
                Analisis Kasus Lain
            </button>
        </div>

    </main>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        
        const apiKey = "AIzaSyBj-rAtV-qQXeR_VBDs4_DazzgUGp-PAnA"; // API Key injected by environment

        // --- 1. Firebase Setup ---
        try {
            const firebaseConfig = JSON.parse(__firebase_config);
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            
            onAuthStateChanged(auth, (user) => {
                const statusEl = document.getElementById('auth-status');
                if (user) {
                    statusEl.innerHTML = '<span class="inline-block w-2 h-2 bg-emerald-400 rounded-full mr-1"></span> Online';
                    statusEl.classList.remove('text-slate-400', 'bg-slate-100');
                    statusEl.classList.add('text-emerald-600', 'bg-emerald-50');
                } else {
                    statusEl.innerHTML = '<span class="inline-block w-2 h-2 bg-amber-400 rounded-full mr-1"></span> Offline';
                     signInAnonymously(auth).catch(e => console.error("Anon Auth Fail:", e));
                }
            });

            // Initial Sign In Strategy
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.error("Auth init failed", err);
                }
            };
            initAuth();

        } catch (e) {
            console.error("Firebase Init Error:", e);
            document.getElementById('auth-status').innerHTML = "Mode Tanpa Auth";
        }

        // --- 2. Core Logic (Exposed to Window) ---
        
        // Helper: Clean JSON string from markdown fences
        function cleanJson(text) {
            if (!text) return "{}";
            // Remove ```json and ``` or just ```
            text = text.replace(/```json/g, "").replace(/```/g, "");
            return text.trim();
        }

        window.generatePlan = async function() {
            const inputEl = document.getElementById('scenario-input');
            const input = inputEl.value.trim();
            
            if (!input) {
                inputEl.classList.add('ring-2', 'ring-red-400', 'bg-red-50');
                setTimeout(() => inputEl.classList.remove('ring-2', 'ring-red-400', 'bg-red-50'), 500);
                return;
            }
            
            // Switch to Loading View
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            try {
                const prompt = `
                    BERTINDAK SEBAGAI: Konsultan manajemen perilaku kelas.
                    SITUASI: "${input}"
                    
                    TUGAS: Buat rencana 3-Fase untuk guru.
                    
                    INSTRUKSI ISI:
                    1. diagnosis: Diagnosa singkat (1 kalimat).
                    2. phase1: Instruksi Non-Verbal (tatapan, posisi). Gunakan markdown list.
                    3. phase2: Naskah/Script Verbal. Apa yang HARUS diucapkan guru. Gunakan markdown list/bold.
                    4. phase3: Redireksi ke pelajaran. Gunakan markdown list.
                    5. cohesion: Saran untuk menjaga kelas tetap fokus.
                    
                    OUTPUT: JSON VALID Saja. Jangan gunakan markdown block fences.
                `;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    diagnosis: { type: "STRING" },
                                    phase1: { type: "STRING" },
                                    phase2: { type: "STRING" },
                                    phase3: { type: "STRING" },
                                    cohesion: { type: "STRING" }
                                },
                                required: ["diagnosis", "phase1", "phase2", "phase3", "cohesion"]
                            }
                        }
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const jsonData = await response.json();
                const rawText = jsonData.candidates[0].content.parts[0].text;
                
                // IMPORTANT: Clean the text before parsing
                const cleanText = cleanJson(rawText);
                const data = JSON.parse(cleanText);

                renderResult(data);

            } catch (error) {
                console.error("Error Detail:", error);
                alert("Terjadi kesalahan. Coba lagi.");
                window.resetApp();
            }
        };

        // --- 3. Parsing & Rendering ---
        function renderResult(data) {
            document.getElementById('loading-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');

            // Fallback values if fields are missing
            document.getElementById('scenario-output').innerText = data.diagnosis || "Skenario terdeteksi";
            document.getElementById('cohesion-output').innerText = data.cohesion || "Tetap tenang.";

            // Render Markdown
            document.getElementById('phase-1-content').innerHTML = marked.parse(data.phase1 || "Tarik napas, diam sejenak.");
            document.getElementById('phase-2-content').innerHTML = marked.parse(data.phase2 || "Katakan: 'Kita fokus kembali.'");
            document.getElementById('phase-3-content').innerHTML = marked.parse(data.phase3 || "Lanjutkan pelajaran.");
            
            if (window.lucide) lucide.createIcons();
        }

        // Helper Functions
        window.fillInput = (text) => {
            const el = document.getElementById('scenario-input');
            el.value = text;
            el.focus();
        };

        window.resetApp = () => {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('loading-section').classList.add('hidden');
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('scenario-input').value = "";
        };

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
