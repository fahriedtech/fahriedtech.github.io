<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Bullying Race Game</title>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    * {
      box-sizing: border-box;
    }
    
    .race-track {
      position: relative;
      height: 200px;
      background: linear-gradient(to bottom, #34d399 0%, #10b981 100%);
      border-radius: 12px;
      overflow: visible;
      margin: 20px 0;
    }
    
    .track-lines {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 4.5%,
        rgba(255, 255, 255, 0.3) 4.5%,
        rgba(255, 255, 255, 0.3) 5.5%,
        transparent 5.5%
      );
    }
    
    .track-lane {
      position: absolute;
      width: 100%;
      height: 50%;
      border-bottom: 2px solid rgba(255, 255, 255, 0.4);
    }
    
    .track-lane.top {
      top: 0;
    }
    
    .track-lane.bottom {
      bottom: 0;
    }
    
    .avatar {
      position: absolute;
      width: 60px;
      height: 60px;
      transition: left 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      object-fit: contain;
    }
    
    .avatar.blue {
      top: 25%;
      transform: translate(-50%, -50%);
    }
    
    .avatar.red {
      top: 75%;
      transform: translate(-50%, -50%);
    }
    
    .avatar.jump {
      animation: jump 0.5s ease-in-out;
    }
    
    @keyframes jump {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, -80px); }
    }
    
    .feedback {
      position: absolute;
      font-size: 72px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }
    
    .feedback.show {
      animation: feedbackPop 1s ease-out;
    }
    
    @keyframes feedbackPop {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1); }
    }
    
    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .trophy-icon {
      font-size: 120px;
      animation: trophySpin 2s ease-in-out infinite;
    }
    
    @keyframes trophySpin {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      50% { transform: rotate(5deg) scale(1.1); }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="w-full h-full">
  <div id="app" class="w-full h-full"></div>
  <script>
    const defaultConfig = {
      game_title: "Cyber Bullying Race",
      timer_label: "Waktu Tersisa",
      left_team_name: "Tim Biru",
      right_team_name: "Tim Merah",
      start_button: "Mulai Permainan",
      true_button: "BENAR",
      false_button: "SALAH",
      skip_button: "SKIP",
      background_color: "#0f172a",
      surface_color: "#1e293b",
      text_color: "#f1f5f9",
      primary_action_color: "#3b82f6",
      secondary_action_color: "#64748b",
      font_family: "Inter",
      font_size: 16
    };

    let currentRecords = [];
    let gameState = {
      phase: 'SETUP', // SETUP, PLAYING, REVISION, ENDED
      leftTeam: { score: 0, position: 0, skipsUsed: 0, wrongAnswers: [], skipAnswers: [] },
      rightTeam: { score: 0, position: 0, skipsUsed: 0, wrongAnswers: [], skipAnswers: [] },
      currentLeftQuestion: null,
      currentRightQuestion: null,
      timeRemaining: 180,
      timerInterval: null,
      questions: [],
      usedQuestionIds: new Set(),
      revisionQuestions: []
    };

    const dataHandler = {
      onDataChanged(data) {
        currentRecords = data;
      }
    };

    async function initializeDataSdk() {
      const result = await window.dataSdk.init(dataHandler);
      if (!result.isOk) {
        console.error("Failed to initialize Data SDK");
      }
    }

    async function saveAnswer(team, questionId, answer, isCorrect, phase) {
      if (currentRecords.length >= 999) {
        return;
      }
      
      const result = await window.dataSdk.create({
        team: team,
        question_id: questionId,
        answer: answer,
        is_correct: isCorrect,
        timestamp: new Date().toISOString(),
        game_phase: phase
      });
      
      if (!result.isOk) {
        console.error("Failed to save answer");
      }
    }

    async function loadQuestions() {
      const sheetUrl = 'https://docs.google.com/spreadsheets/d/1qR28r4Gpu4IwsFeAkairSYhsOJj4hGi-tELRIAHgRvg/gviz/tq?tqx=out:json';
      
      try {
        const response = await fetch(sheetUrl);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        
        const questions = json.table.rows.slice(1).map((row, index) => {
          const statement = row.c[0]?.v || '';
          const answerCell = row.c[1]?.v || '';
          
          // Accept: "benar", "BENAR", "true", "TRUE", "True", "B", "b"
          const correctAnswer = answerCell.toString().toLowerCase().trim() === 'benar' || 
                               answerCell.toString().toLowerCase().trim() === 'true' ||
                               answerCell.toString().toLowerCase().trim() === 'b';
          
          return {
            id: `q${index}`,
            statement: statement,
            correctAnswer: correctAnswer
          };
        }).filter(q => q.statement);
        
        gameState.questions = questions;
        console.log('Loaded questions:', questions); // For debugging
        return questions.length > 0;
      } catch (error) {
        console.error('Error loading questions:', error);
        return false;
      }
    }

    function getRandomQuestion(excludeIds = new Set()) {
      const available = gameState.questions.filter(q => !excludeIds.has(q.id));
      if (available.length === 0) return null;
      return available[Math.floor(Math.random() * available.length)];
    }

    function startGame() {
      gameState.phase = 'PLAYING';
      gameState.timeRemaining = 180;
      gameState.leftTeam = { score: 0, position: 0, skipsUsed: 0, wrongAnswers: [], skipAnswers: [] };
      gameState.rightTeam = { score: 0, position: 0, skipsUsed: 0, wrongAnswers: [], skipAnswers: [] };
      gameState.usedQuestionIds = new Set();
      
      gameState.currentLeftQuestion = getRandomQuestion(gameState.usedQuestionIds);
      if (gameState.currentLeftQuestion) gameState.usedQuestionIds.add(gameState.currentLeftQuestion.id);
      
      gameState.currentRightQuestion = getRandomQuestion(gameState.usedQuestionIds);
      if (gameState.currentRightQuestion) gameState.usedQuestionIds.add(gameState.currentRightQuestion.id);
      
      gameState.timerInterval = setInterval(() => {
        gameState.timeRemaining--;
        if (gameState.timeRemaining <= 0) {
          clearInterval(gameState.timerInterval);
          startRevisionPhase();
        }
        render();
      }, 1000);
      
      render();
    }

    function answerQuestion(team, answer) {
      const isLeft = team === 'left';
      const teamData = isLeft ? gameState.leftTeam : gameState.rightTeam;
      const question = isLeft ? gameState.currentLeftQuestion : gameState.currentRightQuestion;
      
      if (!question) return;
      
      const isCorrect = (answer === 'true' && question.correctAnswer) || 
                       (answer === 'false' && !question.correctAnswer);
      
      saveAnswer(team, question.id, answer, isCorrect, gameState.phase);
      
      if (isCorrect) {
        teamData.score++;
        teamData.position++;
        showFeedback(team, true);
        playJumpAnimation(team);
      } else {
        teamData.wrongAnswers.push(question);
        showFeedback(team, false);
      }
      
      // Check if team reached 20 steps
      if (teamData.position >= 20) {
        clearInterval(gameState.timerInterval);
        startRevisionPhase();
        return;
      }
      
      const nextQuestion = getRandomQuestion(gameState.usedQuestionIds);
      if (nextQuestion) {
        gameState.usedQuestionIds.add(nextQuestion.id);
        if (isLeft) {
          gameState.currentLeftQuestion = nextQuestion;
        } else {
          gameState.currentRightQuestion = nextQuestion;
        }
      } else {
        if (isLeft) {
          gameState.currentLeftQuestion = null;
        } else {
          gameState.currentRightQuestion = null;
        }
      }
      
      render();
    }

    function skipQuestion(team) {
      const isLeft = team === 'left';
      const teamData = isLeft ? gameState.leftTeam : gameState.rightTeam;
      const question = isLeft ? gameState.currentLeftQuestion : gameState.currentRightQuestion;
      
      if (!question || teamData.skipsUsed >= 1) return;
      
      teamData.skipsUsed++;
      teamData.skipAnswers.push(question);
      
      const nextQuestion = getRandomQuestion(gameState.usedQuestionIds);
      if (nextQuestion) {
        gameState.usedQuestionIds.add(nextQuestion.id);
        if (isLeft) {
          gameState.currentLeftQuestion = nextQuestion;
        } else {
          gameState.currentRightQuestion = nextQuestion;
        }
      } else {
        if (isLeft) {
          gameState.currentLeftQuestion = null;
        } else {
          gameState.currentRightQuestion = null;
        }
      }
      
      render();
    }

    function startRevisionPhase() {
      clearInterval(gameState.timerInterval);
      gameState.phase = 'REVISION';
      
      gameState.revisionQuestions = [
        ...gameState.leftTeam.wrongAnswers,
        ...gameState.leftTeam.skipAnswers,
        ...gameState.rightTeam.wrongAnswers,
        ...gameState.rightTeam.skipAnswers
      ];
      
      if (gameState.revisionQuestions.length > 0) {
        gameState.currentLeftQuestion = gameState.revisionQuestions[0];
        gameState.currentRightQuestion = gameState.revisionQuestions[0];
      } else {
        endGame();
      }
      
      render();
    }

    function answerRevision(team, answer) {
      const question = gameState.currentLeftQuestion;
      if (!question) return;
      
      const isLeft = team === 'left';
      const teamData = isLeft ? gameState.leftTeam : gameState.rightTeam;
      
      const isCorrect = (answer === 'true' && question.correctAnswer) || 
                       (answer === 'false' && !question.correctAnswer);
      
      saveAnswer(team, question.id, answer, isCorrect, 'REVISION');
      
      if (isCorrect) {
        teamData.position += 2;
        showFeedback(team, true);
        playJumpAnimation(team);
      } else {
        teamData.position = Math.max(0, teamData.position - 1);
        showFeedback(team, false);
      }
      
      gameState.revisionQuestions.shift();
      
      if (gameState.revisionQuestions.length > 0) {
        gameState.currentLeftQuestion = gameState.revisionQuestions[0];
        gameState.currentRightQuestion = gameState.revisionQuestions[0];
      } else {
        endGame();
      }
      
      render();
    }

    function endGame() {
      gameState.phase = 'ENDED';
      render();
    }

    function playSound(isCorrect) {
      // Create audio context
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      if (isCorrect) {
        // Success sound: ascending notes
        oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
        oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
        oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.4);
      } else {
        // Error sound: descending buzzer
        oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.3);
        oscillator.type = 'sawtooth';
        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.3);
      }
    }

    function showFeedback(team, isCorrect) {
      const feedbackId = `feedback-${team}`;
      const feedbackEl = document.getElementById(feedbackId);
      if (feedbackEl) {
        feedbackEl.textContent = isCorrect ? '✓' : '✘';
        feedbackEl.style.color = isCorrect ? '#10b981' : '#ef4444';
        feedbackEl.classList.remove('show');
        void feedbackEl.offsetWidth;
        feedbackEl.classList.add('show');
      }
      
      // Play sound effect
      playSound(isCorrect);
    }

    function playJumpAnimation(team) {
      const avatarId = `avatar-${team}`;
      const avatarEl = document.getElementById(avatarId);
      if (avatarEl) {
        avatarEl.classList.remove('jump');
        void avatarEl.offsetWidth;
        avatarEl.classList.add('jump');
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function render() {
      const config = window.elementSdk?.config || defaultConfig;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;
      const baseFontStack = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;
      
      const app = document.getElementById('app');
      app.style.fontFamily = `${customFont}, ${baseFontStack}`;
      app.style.backgroundColor = backgroundColor;
      app.style.color = textColor;
      
      if (gameState.phase === 'SETUP') {
        app.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-8" style="min-height: 100%;">
            <h1 class="mb-8 font-bold text-center" style="font-size: ${baseSize * 3}px; color: ${textColor}; font-family: ${customFont}, ${baseFontStack};">
              ${config.game_title || defaultConfig.game_title}
            </h1>
            <div class="text-center mb-12" style="font-size: ${baseSize * 1.25}px; color: ${textColor}; font-family: ${customFont}, ${baseFontStack};">
              <p class="mb-4">🏁 Balapan Jawab Soal Cyber Bullying</p>
              <p class="mb-2">⏱️ Durasi: 3 Menit</p>
              <p class="mb-2">✅ Jawaban Benar: +1 Langkah</p>
              <p class="mb-2">❌ Jawaban Salah: Masuk Revisi</p>
              <p class="mb-2">⏭️ Skip: 1x per Tim (Masuk Revisi)</p>
            </div>
            <button id="start-btn" class="px-12 py-6 rounded-xl font-bold shadow-lg transition-all hover:scale-105" 
              style="background-color: ${primaryColor}; color: white; font-size: ${baseSize * 1.5}px; font-family: ${customFont}, ${baseFontStack};">
              ${config.start_button || defaultConfig.start_button}
            </button>
            <div id="loading-msg" class="mt-6" style="font-size: ${baseSize}px; color: ${secondaryColor}; font-family: ${customFont}, ${baseFontStack};"></div>
          </div>
        `;
        
        document.getElementById('start-btn').addEventListener('click', async () => {
          const loadingMsg = document.getElementById('loading-msg');
          loadingMsg.textContent = 'Memuat soal...';
          const success = await loadQuestions();
          if (success && gameState.questions.length > 0) {
            startGame();
          } else {
            loadingMsg.textContent = 'Gagal memuat soal. Silakan coba lagi.';
          }
        });
      } else if (gameState.phase === 'PLAYING' || gameState.phase === 'REVISION') {
        const maxPosition = 20;
        const leftPercent = (gameState.leftTeam.position / maxPosition) * 95;
        const rightPercent = (gameState.rightTeam.position / maxPosition) * 95;
        
        const phaseTitle = gameState.phase === 'REVISION' ? 'BABAK REVISI - Siapa Cepat Dia Dapat!' : 'BALAPAN BERLANGSUNG';
        
        app.innerHTML = `
          <div class="w-full h-full flex flex-col p-6" style="min-height: 100%;">
            <div class="text-center mb-4">
              <h2 class="font-bold mb-2" style="font-size: ${baseSize * 2}px; color: ${textColor}; font-family: ${customFont}, ${baseFontStack};">
                ${phaseTitle}
              </h2>
              <div class="inline-block px-6 py-3 rounded-lg" style="background-color: ${surfaceColor};">
                <span class="font-bold" style="font-size: ${baseSize * 1.5}px; color: ${primaryColor}; font-family: ${customFont}, ${baseFontStack};">
                  ${config.timer_label || defaultConfig.timer_label}: ${formatTime(gameState.timeRemaining)}
                </span>
              </div>
            </div>
            
            <div class="mb-6 rounded-xl p-6" style="background-color: ${surfaceColor};">
              <div class="race-track">
                <div class="track-lines"></div>
                <div class="track-lane top"></div>
                <div class="track-lane bottom"></div>
                <img id="avatar-left" src="https://raw.githubusercontent.com/pakfahri/pakfahri.github.io/47729e4be170252745ed4c9a928d8b8042f63058/laribiru.png" class="avatar blue" style="left: ${leftPercent}%;" alt="Blue Runner">
                <img id="avatar-right" src="https://raw.githubusercontent.com/pakfahri/pakfahri.github.io/47729e4be170252745ed4c9a928d8b8042f63058/larimerah.png" class="avatar red" style="left: ${rightPercent}%;" alt="Red Runner">
              </div>
              <div class="flex justify-around mt-4">
                <div class="text-center">
                  <h3 class="font-bold mb-2" style="font-size: ${baseSize * 1.25}px; color: #3b82f6; font-family: ${customFont}, ${baseFontStack};">
                    ${config.left_team_name || defaultConfig.left_team_name}
                  </h3>
                  <div style="color: ${secondaryColor}; font-size: ${baseSize * 0.875}px; font-family: ${customFont}, ${baseFontStack};">
                    <span>Skor: ${gameState.leftTeam.score}</span> | <span>Posisi: ${gameState.leftTeam.position}/20</span>
                  </div>
                </div>
                <div class="text-center">
                  <h3 class="font-bold mb-2" style="font-size: ${baseSize * 1.25}px; color: #ef4444; font-family: ${customFont}, ${baseFontStack};">
                    ${config.right_team_name || defaultConfig.right_team_name}
                  </h3>
                  <div style="color: ${secondaryColor}; font-size: ${baseSize * 0.875}px; font-family: ${customFont}, ${baseFontStack};">
                    <span>Skor: ${gameState.rightTeam.score}</span> | <span>Posisi: ${gameState.rightTeam.position}/20</span>
                  </div>
                </div>
              </div>
            </div>
            
            <div class="flex-1 flex gap-6" style="min-height: 0;">
              <div class="flex-1 flex flex-col rounded-xl p-6 relative" style="background-color: ${surfaceColor};">
                <div id="feedback-left" class="feedback" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
                
                <h3 class="font-bold mb-3 text-center" style="font-size: ${baseSize * 1.5}px; color: #3b82f6; font-family: ${customFont}, ${baseFontStack};">
                  ${config.left_team_name || defaultConfig.left_team_name}
                </h3>
                
                <div class="flex-1 flex flex-col justify-center mb-4">
                  <div class="p-6 rounded-lg text-center" style="background-color: ${backgroundColor};">
                    <p class="font-semibold" style="font-size: ${baseSize * 1.25}px; color: ${textColor}; font-family: ${customFont}, ${baseFontStack};">
                      ${gameState.currentLeftQuestion ? gameState.currentLeftQuestion.statement : 'Menunggu soal...'}
                    </p>
                  </div>
                </div>
                
                <div class="flex flex-col gap-3">
                  <button id="left-true" class="py-4 rounded-lg font-bold text-white transition-all hover:scale-105" 
                    style="background-color: #10b981; font-size: ${baseSize * 1.125}px; font-family: ${customFont}, ${baseFontStack};"
                    ${!gameState.currentLeftQuestion ? 'disabled' : ''}>
                    ${config.true_button || defaultConfig.true_button}
                  </button>
                  <button id="left-false" class="py-4 rounded-lg font-bold text-white transition-all hover:scale-105" 
                    style="background-color: #ef4444; font-size: ${baseSize * 1.125}px; font-family: ${customFont}, ${baseFontStack};"
                    ${!gameState.currentLeftQuestion ? 'disabled' : ''}>
                    ${config.false_button || defaultConfig.false_button}
                  </button>
                  ${gameState.phase === 'PLAYING' ? `
                    <button id="left-skip" class="py-3 rounded-lg font-bold transition-all hover:scale-105" 
                      style="background-color: ${secondaryColor}; color: white; font-size: ${baseSize}px; font-family: ${customFont}, ${baseFontStack};"
                      ${!gameState.currentLeftQuestion || gameState.leftTeam.skipsUsed >= 1 ? 'disabled' : ''}>
                      ${config.skip_button || defaultConfig.skip_button} (${1 - gameState.leftTeam.skipsUsed}/1)
                    </button>
                  ` : ''}
                </div>
              </div>
              
              <div class="flex-1 flex flex-col rounded-xl p-6 relative" style="background-color: ${surfaceColor};">
                <div id="feedback-right" class="feedback" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
                
                <h3 class="font-bold mb-3 text-center" style="font-size: ${baseSize * 1.5}px; color: #ef4444; font-family: ${customFont}, ${baseFontStack};">
                  ${config.right_team_name || defaultConfig.right_team_name}
                </h3>
                
                <div class="flex-1 flex flex-col justify-center mb-4">
                  <div class="p-6 rounded-lg text-center" style="background-color: ${backgroundColor};">
                    <p class="font-semibold" style="font-size: ${baseSize * 1.25}px; color: ${textColor}; font-family: ${customFont}, ${baseFontStack};">
                      ${gameState.currentRightQuestion ? gameState.currentRightQuestion.statement : 'Menunggu soal...'}
                    </p>
                  </div>
                </div>
                
                <div class="flex flex-col gap-3">
                  <button id="right-true" class="py-4 rounded-lg font-bold text-white transition-all hover:scale-105" 
                    style="background-color: #10b981; font-size: ${baseSize * 1.125}px; font-family: ${customFont}, ${baseFontStack};"
                    ${!gameState.currentRightQuestion ? 'disabled' : ''}>
                    ${config.true_button || defaultConfig.true_button}
                  </button>
                  <button id="right-false" class="py-4 rounded-lg font-bold text-white transition-all hover:scale-105" 
                    style="background-color: #ef4444; font-size: ${baseSize * 1.125}px; font-family: ${customFont}, ${baseFontStack};"
                    ${!gameState.currentRightQuestion ? 'disabled' : ''}>
                    ${config.false_button || defaultConfig.false_button}
                  </button>
                  ${gameState.phase === 'PLAYING' ? `
                    <button id="right-skip" class="py-3 rounded-lg font-bold transition-all hover:scale-105" 
                      style="background-color: ${secondaryColor}; color: white; font-size: ${baseSize}px; font-family: ${customFont}, ${baseFontStack};"
                      ${!gameState.currentRightQuestion || gameState.rightTeam.skipsUsed >= 1 ? 'disabled' : ''}>
                      ${config.skip_button || defaultConfig.skip_button} (${1 - gameState.rightTeam.skipsUsed}/1)
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        `;
        
        if (gameState.phase === 'PLAYING') {
          document.getElementById('left-true').addEventListener('click', () => answerQuestion('left', 'true'));
          document.getElementById('left-false').addEventListener('click', () => answerQuestion('left', 'false'));
          document.getElementById('right-true').addEventListener('click', () => answerQuestion('right', 'true'));
          document.getElementById('right-false').addEventListener('click', () => answerQuestion('right', 'false'));
          
          const leftSkipBtn = document.getElementById('left-skip');
          if (leftSkipBtn) leftSkipBtn.addEventListener('click', () => skipQuestion('left'));
          
          const rightSkipBtn = document.getElementById('right-skip');
          if (rightSkipBtn) rightSkipBtn.addEventListener('click', () => skipQuestion('right'));
        } else {
          document.getElementById('left-true').addEventListener('click', () => answerRevision('left', 'true'));
          document.getElementById('left-false').addEventListener('click', () => answerRevision('left', 'false'));
          document.getElementById('right-true').addEventListener('click', () => answerRevision('right', 'true'));
          document.getElementById('right-false').addEventListener('click', () => answerRevision('right', 'false'));
        }
      } else if (gameState.phase === 'ENDED') {
        let winner = '';
        let winnerColor = primaryColor;
        
        if (gameState.leftTeam.position > gameState.rightTeam.position) {
          winner = config.left_team_name || defaultConfig.left_team_name;
          winnerColor = '#3b82f6';
        } else if (gameState.rightTeam.position > gameState.leftTeam.position) {
          winner = config.right_team_name || defaultConfig.right_team_name;
          winnerColor = '#ef4444';
        } else {
          const leftWrong = gameState.leftTeam.wrongAnswers.length;
          const rightWrong = gameState.rightTeam.wrongAnswers.length;
          
          if (leftWrong < rightWrong) {
            winner = config.left_team_name || defaultConfig.left_team_name;
            winnerColor = '#3b82f6';
          } else if (rightWrong < leftWrong) {
            winner = config.right_team_name || defaultConfig.right_team_name;
            winnerColor = '#ef4444';
          } else {
            winner = 'SERI!';
          }
        }
        
        app.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-8" style="min-height: 100%;">
            <div class="trophy-icon mb-6">🏆</div>
            <h1 class="mb-6 font-bold text-center" style="font-size: ${baseSize * 3}px; color: ${winnerColor}; font-family: ${customFont}, ${baseFontStack};">
              ${winner === 'SERI!' ? 'PERMAINAN SERI!' : winner + ' MENANG!'}
            </h1>
            
            <div class="flex gap-8 mb-8">
              <div class="p-8 rounded-xl text-center" style="background-color: ${surfaceColor};">
                <h3 class="font-bold mb-4" style="font-size: ${baseSize * 1.5}px; color: #3b82f6; font-family: ${customFont}, ${baseFontStack};">
                  ${config.left_team_name || defaultConfig.left_team_name}
                </h3>
                <p class="mb-2" style="font-size: ${baseSize * 1.25}px; color: ${textColor}; font-family: ${customFont}, ${baseFontStack};">
                  Posisi Akhir: ${gameState.leftTeam.position}
                </p>
                <p style="font-size: ${baseSize}px; color: ${secondaryColor}; font-family: ${customFont}, ${baseFontStack};">
                  Skor: ${gameState.leftTeam.score}
                </p>
              </div>
              
              <div class="p-8 rounded-xl text-center" style="background-color: ${surfaceColor};">
                <h3 class="font-bold mb-4" style="font-size: ${baseSize * 1.5}px; color: #ef4444; font-family: ${customFont}, ${baseFontStack};">
                  ${config.right_team_name || defaultConfig.right_team_name}
                </h3>
                <p class="mb-2" style="font-size: ${baseSize * 1.25}px; color: ${textColor}; font-family: ${customFont}, ${baseFontStack};">
                  Posisi Akhir: ${gameState.rightTeam.position}
                </p>
                <p style="font-size: ${baseSize}px; color: ${secondaryColor}; font-family: ${customFont}, ${baseFontStack};">
                  Skor: ${gameState.rightTeam.score}
                </p>
              </div>
            </div>
            
            <button id="restart-btn" class="px-12 py-6 rounded-xl font-bold shadow-lg transition-all hover:scale-105" 
              style="background-color: ${primaryColor}; color: white; font-size: ${baseSize * 1.5}px; font-family: ${customFont}, ${baseFontStack};">
              Main Lagi
            </button>
          </div>
        `;
        
        document.getElementById('restart-btn').addEventListener('click', () => {
          gameState.phase = 'SETUP';
          gameState.usedQuestionIds.clear();
          render();
        });
      }
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["game_title", config.game_title || defaultConfig.game_title],
        ["timer_label", config.timer_label || defaultConfig.timer_label],
        ["left_team_name", config.left_team_name || defaultConfig.left_team_name],
        ["right_team_name", config.right_team_name || defaultConfig.right_team_name],
        ["start_button", config.start_button || defaultConfig.start_button],
        ["true_button", config.true_button || defaultConfig.true_button],
        ["false_button", config.false_button || defaultConfig.false_button],
        ["skip_button", config.skip_button || defaultConfig.skip_button]
      ]);
    }

    window.elementSdk.init({
      defaultConfig,
      onConfigChange,
      mapToCapabilities,
      mapToEditPanelValues
    });

    initializeDataSdk().then(() => {
      render();
    });
