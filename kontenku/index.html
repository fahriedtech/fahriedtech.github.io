<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koleksi Gemini Gems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', // Otomatis mengikuti tema sistem (light/dark)
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Memastikan tidak ada scroll di perangkat apapun */
        body {
            overflow: hidden;
            overscroll-behavior: none;
        }
        /* Efek hover minimalis untuk kartu */
        .gem-card {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="h-[100dvh] w-[100dvw] bg-white dark:bg-black text-black dark:text-white flex flex-col items-center justify-center p-4 sm:p-6 transition-colors duration-300">

    <header class="w-full max-w-5xl flex-none text-center mb-6 sm:mb-8">
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight pb-2">
            My Gemini Gems
        </h1>
        <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400 font-medium">
            Koleksi asisten AI personal
        </p>
    </header>

    <main class="w-full max-w-5xl flex-1 min-h-0 grid grid-cols-2 grid-rows-2 gap-4 sm:gap-6">

        <!-- Card 1: Yuk Buat Animasi -->
        <a href="https://gemini.google.com/gem/1UgZcDjQ9RbBI83RryJcE5neYdO1Uvrzs?usp=sharing" target="_blank" rel="noopener noreferrer" 
           class="gem-card group flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl border-2 border-black dark:border-white bg-white dark:bg-black hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
            <div class="mb-3 sm:mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-10 sm:h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-base sm:text-xl font-bold text-center">Yuk Buat Animasi</h2>
        </a>

        <!-- Card 2: Narasi -->
        <a href="https://gemini.google.com/gem/1goqFKA41T6WlB9pTqxPdhLBQHKZloJeC?usp=sharing" target="_blank" rel="noopener noreferrer" 
           class="gem-card group flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl border-2 border-black dark:border-white bg-white dark:bg-black hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
            <div class="mb-3 sm:mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-10 sm:h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </div>
            <h2 class="text-base sm:text-xl font-bold text-center">Narasi</h2>
        </a>

        <!-- Card 3: Hook -->
        <a href="https://gemini.google.com/gem/1iyPcMPCYfOASBYxUrfVgjMT08mrlW6SL?usp=sharing" target="_blank" rel="noopener noreferrer" 
           class="gem-card group flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl border-2 border-black dark:border-white bg-white dark:bg-black hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
            <div class="mb-3 sm:mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-10 sm:h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h2 class="text-base sm:text-xl font-bold text-center">Hook</h2>
        </a>

        <!-- Card 4: Bodytoonid -->
        <a href="https://gemini.google.com/gem/1a1jDL08Dbdkb1YGqpXL8cAmbtzCPng1s?usp=sharing" target="_blank" rel="noopener noreferrer" 
           class="gem-card group flex flex-col items-center justify-center p-4 sm:p-6 rounded-2xl border-2 border-black dark:border-white bg-white dark:bg-black hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black">
            <div class="mb-3 sm:mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-10 sm:h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
            </div>
            <h2 class="text-base sm:text-xl font-bold text-center">Bodytoonid</h2>
        </a>

    </main>

    <footer class="w-full flex-none text-center mt-6 text-xs sm:text-sm text-gray-500">
        Klik kartu untuk membuka Gem di tab baru.
    </footer>

</body>
</html>
